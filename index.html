<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle Walid</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

    <h1>Dirigez <span>Walid</span> depuis n'importe où</h1>

    <div class="remote-control">
        
        <div class="header">
            <div class="status-dot"></div>
            <p>Walid-Bot : Connecté</p>
        </div>

        <div class="main">
            <button class="btn-direction gauche">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <button class="btn-direction droite">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>

        <div class="footer">
            <button class="btn-action stop"><i class="fa-solid fa-circle-stop"></i> RADAR</button>
            <button class="btn-action auto"><i class="fa-solid fa-robot"></i> AUTO</button>
        </div>
    </div>

</body>
</html>
